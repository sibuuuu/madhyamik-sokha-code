name: my_madhyamik_app
description: "A professional educational quiz and video app for Madhyamik students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_database: ^12.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  font_awesome_flutter: 10.7.0
  http: ^1.6.0
  youtube_player_iframe: ^5.2.1
  screen_protector: ^1.4.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  google_mobile_ads: ^5.1.0
  image_picker: ^1.1.2
  flutter_inappwebview: ^6.0.0
  liquid_pull_to_refresh: ^3.0.1
  rive: ^0.13.20
  lottie: ^3.1.2
  audioplayers: ^6.1.0
  google_sign_in: ^6.2.1  # <-- Added for Google Login
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/coin.png
    - assets/onboarding/
    - assets/icons/
    - assets/logo/
    - assets/subjects/
    - assets/rive/
    - assets/lottie/
    - assets/avatars/free/
    - assets/avatars/premium/
    - assets/sounds/
    - assets/posters/ben/
    - assets/posters/eng/
    - assets/posters/phy/
    - assets/posters/life/
    - assets/posters/geo/
    - assets/posters/hist/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700